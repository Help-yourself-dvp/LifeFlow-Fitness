name: Build Native Android APK

permissions:
  contents: write

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Remove stale capacitor config (legacy PWA leftover)
        run: |
          if [ -f capacitor.config.json ]; then
            echo "Найден устаревший capacitor.config.json — удаляю, чтобы cap init создал правильный."
            rm -f capacitor.config.json
          else
            echo "Старого capacitor.config.json нет, всё чисто."
          fi

      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp app.js www/
          cp food-db.js www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp icon.png www/ 2>/dev/null || true

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/local-notifications@5.0.7 @capacitor/browser@5.2.0

      - name: Init Android
        run: |
          npx cap init "FitFlow" "com.fitflow.app" --web-dir www
          npx cap add android
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/g' android/variables.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' android/variables.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "0.1.47"/g' android/app/build.gradle
          echo 'android.suppressUnsupportedCompileSdk=34' >> android/gradle.properties
          npx cap sync android

      - name: Verify webDir is correct (safety check)
        run: |
          echo "Итоговый capacitor.config.json:"
          cat capacitor.config.json || true
          echo "---"
          echo "Содержимое android/app/src/main/assets/public:"
          ls -la android/app/src/main/assets/public 2>/dev/null | head -30 || echo "путь не найден, пропускаем проверку"

      - name: Patch MainActivity (alarms, battery, backup save bridge)
        run: |
          mkdir -p android/app/src/main/java/com/fitflow/app
          cat > android/app/src/main/java/com/fitflow/app/MainActivity.java << 'EOF'
          package com.fitflow.app;

          import android.app.AlarmManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.speech.RecognizerIntent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import androidx.core.app.NotificationManagerCompat;

          import com.getcapacitor.BridgeActivity;

          import org.json.JSONObject;

          import java.io.OutputStream;
          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {

              private static final int REQ_SAVE_BACKUP = 7301;
              private static final int REQ_VOICE_INPUT = 7302;
              private String pendingBackupJson = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestExactAlarmPermission();
                  requestIgnoreBatteryOptimizations();
                  installBackupBridge();
              }

              /* ===== Сохранение резервной копии через системное окно Android ===== */

              private void installBackupBridge() {
                  try {
                      WebView wv = getBridge().getWebView();
                      if (wv != null) {
                          BackupBridge bridge = new BackupBridge();
                          wv.addJavascriptInterface(bridge, "FitFlowExport");
                          wv.addJavascriptInterface(bridge, "AquaExport");
                      }
                  } catch (Exception e) {
                  }
              }

              public class BackupBridge {
                  /* Производитель устройства — для подсказки по автозапуску */
                  @JavascriptInterface
                  public String getManufacturer() {
                      try {
                          return Build.MANUFACTURER == null ? "" : Build.MANUFACTURER;
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  /* Разрешены ли уведомления */
                  @JavascriptInterface
                  public boolean areNotificationsEnabled() {
                      try {
                          return NotificationManagerCompat.from(MainActivity.this).areNotificationsEnabled();
                      } catch (Exception e) {
                          return true;
                      }
                  }

                  /* Выключены ли оптимизации батареи для приложения */
                  @JavascriptInterface
                  public boolean isBatteryOptimizationIgnored() {
                      try {
                          PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                          return pm != null && pm.isIgnoringBatteryOptimizations(getPackageName());
                      } catch (Exception e) {
                          return true;
                      }
                  }

                  /* Открыть нужный экран системных настроек */
                  @JavascriptInterface
                  public void openSettingsScreen(final String which) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              openSettings(which);
                          }
                      });
                  }

                  /* Офлайн-предпочтительный системный голосовой ввод Android */
                  @JavascriptInterface
                  public void startVoiceInput() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ru-RU");
                                  intent.putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true);
                                  intent.putExtra(RecognizerIntent.EXTRA_PROMPT, "Расскажите о воде, еде и активности");
                                  startActivityForResult(intent, REQ_VOICE_INPUT);
                              } catch (Exception e) {
                                  notifyVoiceResult("");
                              }
                          }
                      });
                  }

                  /* Закрыть приложение, если пользователь не принял условия */
                  @JavascriptInterface
                  public void closeApp() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try { finishAndRemoveTask(); } catch (Exception e) { finish(); }
                          }
                      });
                  }

                  /* Обновить компактный Android-виджет из WebView */
                  @JavascriptInterface
                  public void updateWidget(final String json) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  JSONObject data = new JSONObject(json == null ? "{}" : json);
                                  SharedPreferences prefs = getSharedPreferences("fitflow_widget", MODE_PRIVATE);
                                  prefs.edit()
                                      .putInt("waterTotal", data.optInt("waterTotal", 0))
                                      .putInt("waterGoal", data.optInt("waterGoal", 2500))
                                      .putInt("foodTotal", data.optInt("foodTotal", 0))
                                      .putInt("foodGoal", data.optInt("foodGoal", 2000))
                                      .putInt("activityMinutes", data.optInt("activityMinutes", 0))
                                      .putString("date", data.optString("date", ""))
                                      .apply();
                                  FitFlowWidgetProvider.updateAll(MainActivity.this);
                              } catch (Exception e) {
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void saveBackup(final String json, final String fileName) {
                      pendingBackupJson = json;
                      final String name = (fileName == null || fileName.length() == 0)
                              ? "fitflow-backup.json"
                              : fileName;
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                                  intent.setType("application/json");
                                  intent.putExtra(Intent.EXTRA_TITLE, name);
                                  startActivityForResult(intent, REQ_SAVE_BACKUP);
                              } catch (Exception e) {
                                  pendingBackupJson = null;
                                  notifyBackupResult(false, "Системное окно сохранения недоступно");
                              }
                          }
                      });
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_VOICE_INPUT) {
                      String text = "";
                      try {
                          if (resultCode == RESULT_OK && data != null) {
                              ArrayList<String> results = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                              if (results != null && !results.isEmpty()) text = results.get(0);
                          }
                      } catch (Exception e) {
                      }
                      notifyVoiceResult(text);
                      return;
                  }
                  if (requestCode == REQ_SAVE_BACKUP) {
                      String json = pendingBackupJson;
                      pendingBackupJson = null;
                      Uri uri = (data == null) ? null : data.getData();
                      if (resultCode == RESULT_OK && uri != null && json != null) {
                          OutputStream os = null;
                          try {
                              os = getContentResolver().openOutputStream(uri, "w");
                              os.write(json.getBytes("UTF-8"));
                              os.flush();
                              notifyBackupResult(true, "Резервная копия сохранена");
                          } catch (Exception e) {
                              notifyBackupResult(false, "Не удалось записать файл");
                          } finally {
                              try { if (os != null) os.close(); } catch (Exception e2) { }
                          }
                      } else {
                          notifyBackupResult(false, "Сохранение отменено");
                      }
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              private void notifyVoiceResult(final String text) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              WebView wv = getBridge().getWebView();
                              if (wv == null) return;
                              String js = "window.onVoiceInputResult && window.onVoiceInputResult(" + JSONObject.quote(text) + ");";
                              wv.evaluateJavascript(js, null);
                          } catch (Exception e) {
                          }
                      }
                  });
              }

              private void notifyBackupResult(final boolean ok, final String message) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              WebView wv = getBridge().getWebView();
                              if (wv == null) return;
                              String js = "window.onBackupSaveResult && window.onBackupSaveResult("
                                      + ok + "," + JSONObject.quote(message) + ");";
                              wv.evaluateJavascript(js, null);
                          } catch (Exception e) {
                          }
                      }
                  });
              }

              /* ===== Экраны системных настроек ===== */

              private void openSettings(String which) {
                  if ("battery".equals(which)) {
                      boolean granted = false;
                      try {
                          PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                          granted = pm != null && pm.isIgnoringBatteryOptimizations(getPackageName());
                      } catch (Exception e) {
                      }

                      if (!granted) {
                          if (tryStart(new Intent(
                                  Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                  Uri.parse("package:" + getPackageName())))) return;
                      }

                      if (tryStart(new Intent(
                              Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))) return;
                      openAppDetails();
                      return;
                  }

                  if ("notifications".equals(which)) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          Intent i = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                          i.putExtra(Settings.EXTRA_APP_PACKAGE, getPackageName());
                          if (tryStart(i)) return;
                      }
                      openAppDetails();
                      return;
                  }

                  if ("autostart".equals(which)) {
                      if (tryAutostart()) return;
                      openAppDetails();
                      return;
                  }
                  openAppDetails();
              }

              private boolean tryAutostart() {
                  String[][] targets = new String[][] {
                      { "com.miui.securitycenter", "com.miui.permcenter.autostart.AutoStartManagementActivity" },
                      { "com.huawei.systemmanager", "com.huawei.systemmanager.startupmgr.ui.StartupNormalAppListActivity" },
                      { "com.huawei.systemmanager", "com.huawei.systemmanager.optimize.process.ProtectActivity" },
                      { "com.coloros.safecenter", "com.coloros.safecenter.permission.startup.StartupAppListActivity" },
                      { "com.coloros.safecenter", "com.coloros.safecenter.startupapp.StartupAppListActivity" },
                      { "com.oppo.safe", "com.oppo.safe.permission.startup.StartupAppListActivity" },
                      { "com.vivo.permissionmanager", "com.vivo.permissionmanager.activity.BgStartUpManagerActivity" },
                      { "com.iqoo.secure", "com.iqoo.secure.ui.phoneoptimize.AddWhiteListActivity" },
                      { "com.samsung.android.lool", "com.samsung.android.sm.ui.battery.BatteryActivity" },
                      { "com.letv.android.letvsafe", "com.letv.android.letvsafe.AutobootManageActivity" },
                      { "com.asus.mobilemanager", "com.asus.mobilemanager.entry.FunctionActivity" }
                  };
                  for (String[] t : targets) {
                      Intent i = new Intent();
                      i.setClassName(t[0], t[1]);
                      if (tryStart(i)) return true;
                  }
                  return false;
              }

              private void openAppDetails() {
                  tryStart(new Intent(
                          Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                          Uri.parse("package:" + getPackageName())));
              }

              private boolean tryStart(Intent intent) {
                  try {
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }
              
              /* ===== Разрешения ===== */

              private void requestExactAlarmPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      try {
                          AlarmManager am = (AlarmManager) getSystemService(ALARM_SERVICE);
                          if (am != null && !am.canScheduleExactAlarms()) {
                              Intent intent = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM);
                              intent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(intent);
                          }
                      } catch (Exception e) {
                      }
                  }
              }

              private void requestIgnoreBatteryOptimizations() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          intent.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      }
                  } catch (Exception e) {
                  }
              }
          }
          EOF

          cat > android/app/src/main/java/com/fitflow/app/FitFlowWidgetProvider.java << 'EOF'
          package com.fitflow.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.widget.RemoteViews;

          public class FitFlowWidgetProvider extends AppWidgetProvider {
              public static void updateAll(Context context) {
                  AppWidgetManager manager = AppWidgetManager.getInstance(context);
                  ComponentName component = new ComponentName(context, FitFlowWidgetProvider.class);
                  int[] ids = manager.getAppWidgetIds(component);
                  for (int id : ids) updateWidget(context, manager, id);
              }

              @Override
              public void onUpdate(Context context, AppWidgetManager manager, int[] ids) {
                  for (int id : ids) updateWidget(context, manager, id);
              }

              @Override
              public void onAppWidgetOptionsChanged(Context context, AppWidgetManager manager, int id, Bundle options) {
                  updateWidget(context, manager, id);
              }

              private static void updateWidget(Context context, AppWidgetManager manager, int id) {
                  SharedPreferences prefs = context.getSharedPreferences("fitflow_widget", Context.MODE_PRIVATE);
                  int water = prefs.getInt("waterTotal", 0);
                  int waterGoal = prefs.getInt("waterGoal", 2500);
                  int food = prefs.getInt("foodTotal", 0);
                  int foodGoal = prefs.getInt("foodGoal", 2000);
                  int activity = prefs.getInt("activityMinutes", 0);

                  Bundle options = manager.getAppWidgetOptions(id);
                  int maxWidth = options.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_WIDTH, 180);
                  int maxHeight = options.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 110);
                  boolean large = maxWidth >= 250 || maxHeight >= 180;
                  RemoteViews views = new RemoteViews(context.getPackageName(), large ? R.layout.fitflow_widget_large : R.layout.fitflow_widget);
                  views.setTextViewText(R.id.widget_water, "Вода: " + water + " / " + waterGoal + " мл");
                  views.setTextViewText(R.id.widget_food, "Питание: " + food + " / " + foodGoal + " ккал");
                  views.setProgressBar(R.id.widget_water_bar, 100, Math.min(100, Math.round(waterGoal > 0 ? water * 100f / waterGoal : 0)), false);
                  views.setProgressBar(R.id.widget_food_bar, 100, Math.min(100, Math.round(foodGoal > 0 ? food * 100f / foodGoal : 0)), false);
                  if (large) {
                      views.setTextViewText(R.id.widget_water_pct, Math.min(100, Math.round(waterGoal > 0 ? water * 100f / waterGoal : 0)) + "% цели");
                      views.setTextViewText(R.id.widget_food_pct, Math.min(100, Math.round(foodGoal > 0 ? food * 100f / foodGoal : 0)) + "% цели");
                      views.setTextViewText(R.id.widget_activity, "Активность: " + formatActivity(activity));
                  }

                  Intent launch = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
                  if (launch == null) launch = new Intent(context, MainActivity.class);
                  launch.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pending = PendingIntent.getActivity(context, 0, launch,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  views.setOnClickPendingIntent(R.id.widget_root, pending);
                  manager.updateAppWidget(id, views);
              }

              private static String formatActivity(int minutes) {
                  if (minutes <= 0) return "0 мин";
                  int hours = minutes / 60;
                  int rest = minutes % 60;
                  if (hours == 0) return minutes + " мин";
                  if (rest == 0) return hours + " ч";
                  return hours + " ч " + rest + " мин";
              }
          }
          EOF

      - name: Patch manifest and icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
          python3 << 'ENDSCRIPT'
          from pathlib import Path
          from PIL import Image

          man = Path('android/app/src/main/AndroidManifest.xml')
          t = man.read_text(encoding='utf-8')
          perms = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECORD_AUDIO',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.USE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.WAKE_LOCK',
              'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
          ]
          for p in perms:
              tag = f'    <uses-permission android:name="{p}" />\n'
              if p not in t:
                  t = t.replace('</manifest>', tag + '</manifest>')
          receiver = (
              '        <receiver android:name=".FitFlowWidgetProvider" android:exported="false">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
              '            </intent-filter>\n'
              '            <meta-data android:name="android.appwidget.provider" android:resource="@xml/fitflow_widget_info" />\n'
              '        </receiver>\n'
          )
          if 'FitFlowWidgetProvider' not in t:
              t = t.replace('</application>', receiver + '    </application>')
          man.write_text(t, encoding='utf-8')

          res = Path('android/app/src/main/res')
          for p in res.rglob('ic_launcher*'):
              if p.is_file():
                  p.unlink()
          legacy = res / 'values' / 'ic_launcher_background.xml'
          if legacy.exists():
              legacy.unlink()

          icon = Path('icon.png')
          if not icon.exists():
              print('no icon.png')
              raise SystemExit(0)

          src = Image.open(icon).convert('RGBA')
          BG = (0, 105, 107, 255)

          def solid(size, path):
              c = Image.new('RGBA', (size, size), BG)
              fg = src.copy()
              fg.thumbnail((int(size * 0.72), int(size * 0.72)), Image.Resampling.LANCZOS)
              c.paste(fg, ((size - fg.width) // 2, (size - fg.height) // 2), fg)
              path.parent.mkdir(parents=True, exist_ok=True)
              c.convert('RGB').save(path, format='PNG')

          def foreground(size, path):
              c = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              fg = src.copy()
              fg.thumbnail((int(size * 0.72), int(size * 0.72)), Image.Resampling.LANCZOS)
              c.paste(fg, ((size - fg.width) // 2, (size - fg.height) // 2), fg)
              path.parent.mkdir(parents=True, exist_ok=True)
              c.save(path, format='PNG')

          for folder, size in {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }.items():
              d = res / folder
              solid(size, d / 'ic_launcher.png')
              solid(size, d / 'ic_launcher_round.png')
              foreground(size, d / 'ic_launcher_foreground.png')

          drawable = res / 'drawable'
          foreground(324, drawable / 'ic_launcher_foreground.png')
          src.resize((96, 96), Image.Resampling.LANCZOS).save(drawable / 'ic_stat_icon.png', format='PNG')

          (res / 'values').mkdir(parents=True, exist_ok=True)
          (res / 'values' / 'colors.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="colorPrimary">#00696B</color>\n'
              '    <color name="colorPrimaryDark">#005052</color>\n'
              '    <color name="ic_launcher_background">#00696B</color>\n'
              '</resources>\n',
              encoding='utf-8',
          )

          (drawable / 'ic_launcher_background.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<vector xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    android:width="108dp"\n'
              '    android:height="108dp"\n'
              '    android:viewportWidth="108"\n'
              '    android:viewportHeight="108">\n'
              '    <path android:fillColor="#00696B" android:pathData="M0,0h108v108h-108z"/>\n'
              '</vector>\n',
              encoding='utf-8',
          )

          (drawable / 'fitflow_widget_background.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n'
              '    <solid android:color="#E8F5F4"/>\n'
              '    <corners android:radius="20dp"/>\n'
              '    <stroke android:width="1dp" android:color="#7AA6A6"/>\n'
              '</shape>\n', encoding='utf-8')

          layout = res / 'layout'
          layout.mkdir(parents=True, exist_ok=True)
          (layout / 'fitflow_widget.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    android:id="@+id/widget_root" android:layout_width="match_parent" android:layout_height="match_parent"\n'
              '    android:background="@drawable/fitflow_widget_background" android:orientation="vertical" android:padding="14dp">\n'
              '    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="FITFLOW · СЕГОДНЯ" android:textColor="#00696B" android:textSize="11sp" android:fontFamily="sans-serif-medium" />\n'
              '    <TextView android:id="@+id/widget_water" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:text="Вода: 0 / 2500 мл" android:textColor="#002021" android:textSize="15sp" android:fontFamily="sans-serif-medium" />\n'
              '    <ProgressBar android:id="@+id/widget_water_bar" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="4dp" android:layout_marginTop="3dp" android:max="100" android:progress="0" android:progressTint="#00696B" />\n'
              '    <TextView android:id="@+id/widget_food" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="5dp" android:text="Питание: 0 / 2000 ккал" android:textColor="#003738" android:textSize="13sp" />\n'
              '    <ProgressBar android:id="@+id/widget_food_bar" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="4dp" android:layout_marginTop="3dp" android:max="100" android:progress="0" android:progressTint="#FF9E3D" />\n'
              '</LinearLayout>\n', encoding='utf-8')
          (layout / 'fitflow_widget_large.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    android:id="@+id/widget_root" android:layout_width="match_parent" android:layout_height="match_parent"\n'
              '    android:background="@drawable/fitflow_widget_background" android:orientation="vertical" android:padding="16dp">\n'
              '    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="FITFLOW · СЕГОДНЯ" android:textColor="#00696B" android:textSize="12sp" android:fontFamily="sans-serif-medium" />\n'
              '    <TextView android:id="@+id/widget_water" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="9dp" android:text="Вода: 0 / 2500 мл" android:textColor="#002021" android:textSize="16sp" android:fontFamily="sans-serif-medium" />\n'
              '    <ProgressBar android:id="@+id/widget_water_bar" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="5dp" android:layout_marginTop="3dp" android:max="100" android:progress="0" android:progressTint="#00696B" />\n'
              '    <TextView android:id="@+id/widget_water_pct" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="0% цели" android:textColor="#00696B" android:textSize="12sp" />\n'
              '    <TextView android:id="@+id/widget_food" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="7dp" android:text="Питание: 0 / 2000 ккал" android:textColor="#002021" android:textSize="16sp" android:fontFamily="sans-serif-medium" />\n'
              '    <ProgressBar android:id="@+id/widget_food_bar" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="5dp" android:layout_marginTop="3dp" android:max="100" android:progress="0" android:progressTint="#FF9E3D" />\n'
              '    <TextView android:id="@+id/widget_food_pct" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="0% цели" android:textColor="#8F4C00" android:textSize="12sp" />\n'
              '    <TextView android:id="@+id/widget_activity" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="7dp" android:text="Активность: 0 мин" android:textColor="#003738" android:textSize="14sp" android:fontFamily="sans-serif-medium" />\n'
              '</LinearLayout>\n', encoding='utf-8')
          xml = res / 'xml'
          xml.mkdir(parents=True, exist_ok=True)
          (xml / 'fitflow_widget_info.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    android:minWidth="180dp"\n'
              '    android:minHeight="110dp"\n'
              '    android:updatePeriodMillis="0"\n'
              '    android:initialLayout="@layout/fitflow_widget"\n'
              '    android:resizeMode="horizontal|vertical"\n'
              '    android:widgetCategory="home_screen" />\n', encoding='utf-8')

          adaptive = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@drawable/ic_launcher_background"/>\n'
              '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          anydpi = res / 'mipmap-anydpi-v26'
          anydpi.mkdir(parents=True, exist_ok=True)
          (anydpi / 'ic_launcher.xml').write_text(adaptive, encoding='utf-8')
          (anydpi / 'ic_launcher_round.xml').write_text(adaptive, encoding='utf-8')
          print('OK icons + manifest')
          ENDSCRIPT

      - name: Restore stable debug keystore (signing)
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            echo "Стабильный debug.keystore восстановлен из секрета — подпись будет постоянной."
          else
            echo "ВНИМАНИЕ: секрет DEBUG_KEYSTORE_BASE64 не найден, будет использован автоматически создаваемый debug.keystore."
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/FitFlow-v0.1.47-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitFlow-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/FitFlow-v0.1.47-debug.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.47-build${{ github.run_number }}
          name: FitFlow 0.1.47 (build ${{ github.run_number }})
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/FitFlow-v0.1.47-debug.apk
