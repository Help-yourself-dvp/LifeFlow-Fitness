          # 0.9.32: отдельная разметка «колец» — кнопки ПРОЗРАЧНЫЕ, только ловят
          # нажатие. Сами пилюли (заливка, кромка, значок, текст) рисует Canvas
          # в FitFlowWidgetPaint.neonPill(), иначе поверх нарисованной пилюли
          # легла бы вторая, системная. (0.9.47: раньше эту разметку делила
          # с «каплей» общая карточка — теперь у каждого оформления своя.)
          # Отступы обязаны совпадать с neonPill(): кнопка 26dp, снизу 7dp,
          # по бокам 10dp, между кнопками 8dp.
          #
          # 0.9.33: кнопок может быть от одной до трёх — набор следует составу
          # виджета (выключили «Питание» — пропала и дуга, и кнопка «Еда»).
