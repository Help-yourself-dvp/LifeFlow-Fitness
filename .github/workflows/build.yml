              '            android:layout_height="match_parent" android:layout_weight="42" android:text=""\n'
              '            android:background="@android:color/transparent"\n'
              '            android:contentDescription="Открыть раздел воды" />\n'
              '        <LinearLayout android:layout_width="0dp" android:layout_height="match_parent"\n'
              '            android:layout_weight="58" android:orientation="vertical"\n'
              '            android:paddingStart="7dp">\n'
              '            <LinearLayout android:layout_width="match_parent" android:layout_height="0dp"\n'
              '                android:layout_weight="1" android:orientation="horizontal">\n'
              '                <Button android:id="@+id/widget_tiles_slot_1" android:layout_width="0dp"\n'
              '                    android:layout_height="match_parent" android:layout_weight="1"\n'
              '                    android:text="" android:background="@android:color/transparent"\n'
              '                    android:contentDescription="Открыть первый показатель" />\n'
              '                <Button android:id="@+id/widget_tiles_slot_2" android:layout_width="0dp"\n'
              '                    android:layout_height="match_parent" android:layout_weight="1"\n'
              '                    android:text="" android:background="@android:color/transparent"\n'
              '                    android:contentDescription="Открыть второй показатель" />\n'
              '            </LinearLayout>\n'
              '            <LinearLayout android:layout_width="match_parent" android:layout_height="0dp"\n'
              '                android:layout_weight="1" android:orientation="horizontal">\n'
              '                <Button android:id="@+id/widget_tiles_slot_3" android:layout_width="0dp"\n'
              '                    android:layout_height="match_parent" android:layout_weight="1"\n'
              '                    android:text="" android:background="@android:color/transparent"\n'
              '                    android:contentDescription="Открыть третий показатель" />\n'
              '                <Button android:id="@+id/widget_tiles_slot_4" android:layout_width="0dp"\n'
              '                    android:layout_height="match_parent" android:layout_weight="1"\n'
              '                    android:text="" android:background="@android:color/transparent"\n'
              '                    android:contentDescription="Открыть четвёртый показатель" />\n'
              '            </LinearLayout>\n'
              '        </LinearLayout>\n'
              '    </LinearLayout>\n'
              '    <Button android:id="@+id/widget_canvas_gear_btn" android:layout_width="26dp"\n'
              '        android:layout_height="26dp" android:layout_gravity="top|end"\n'
              '        android:layout_marginTop="2dp" android:layout_marginEnd="2dp" android:text=""\n'
              '        android:background="@android:color/transparent"\n'
              '        android:contentDescription="Настроить показатели виджета" />\n'
              '    <LinearLayout android:layout_width="match_parent" android:layout_height="30dp"\n'
              '        android:layout_gravity="bottom" android:orientation="horizontal"\n'
              '        android:paddingStart="8dp" android:paddingEnd="8dp" android:paddingBottom="8dp">\n'
              '        <Button android:id="@+id/widget_canvas_water_btn" android:layout_width="0dp"\n'
              '            android:layout_height="match_parent" android:layout_weight="42" android:text=""\n'
              '            android:background="@android:color/transparent"\n'
