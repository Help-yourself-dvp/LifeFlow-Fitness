              '        android:background="@android:color/transparent"\n'
              '        android:contentDescription="Настроить показатели виджета" />\n'
              '    <LinearLayout android:id="@+id/widget_p5_buttons" android:layout_width="match_parent"\n'
              '        android:layout_height="wrap_content" android:layout_gravity="bottom"\n'
              '        android:orientation="horizontal" android:paddingStart="10dp" android:paddingEnd="10dp"\n'
              '        android:paddingBottom="7dp">\n'
              '        <Button android:id="@+id/widget_canvas_water_btn" android:layout_width="0dp" android:layout_height="26dp"\n'
              '            android:layout_weight="1" android:layout_marginEnd="4dp" android:text=""\n'
              '            android:background="@android:color/transparent" android:contentDescription="Добавить 250 миллилитров воды" />\n'
              '        <Button android:id="@+id/widget_canvas_record_btn" android:layout_width="0dp" android:layout_height="26dp"\n'
              '            android:layout_weight="1" android:layout_marginStart="4dp" android:layout_marginEnd="4dp" android:text=""\n'
              '            android:background="@android:color/transparent" android:contentDescription="Записать приём пищи" />\n'
              '        <Button android:id="@+id/widget_canvas_dose_btn" android:layout_width="0dp" android:layout_height="26dp"\n'
              '            android:layout_weight="1" android:layout_marginStart="4dp" android:text=""\n'
              '            android:background="@android:color/transparent" android:contentDescription="Отметить витамины" />\n'
              '    </LinearLayout>\n'
              '</FrameLayout>\n', encoding='utf-8')

          # 0.9.35: разметка «плиток». Кнопка «+250 мл» рисуется Canvas ВНУТРИ
          # виджета (референс владельца), поверх неё — прозрачная ловушка.
          # Её положение обязано совпадать с drawTiles(): блок слева шириной
          # 42 % от рабочей ширины, высота кнопки 30dp, поля 8dp.
          # Ловушка шестерёнки — в правом верхнем углу, как у «колец».
          (layout / 'fitflow_widget_tiles.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"\n'
