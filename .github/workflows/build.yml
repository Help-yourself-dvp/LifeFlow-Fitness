              '</FrameLayout>\n', encoding='utf-8')

          # 0.9.26: разметка бенто — android-res/layout/fitflow_widget_bento.xml
          # (копируется выше). Фон — design/widget_bento_bg.png → drawable/widget_bento_bg.png.
          # Старые shape-карточки 0.9.25 больше не генерируем: тени и неон на подложке.

          xml = res / 'xml'
          xml.mkdir(parents=True, exist_ok=True)
          # 0.9.47 (пункт 9 владельца): у классического списочного виджета
          # появилась картинка предпросмотра. Без неё лаунчер рисует иконку
          # приложения, и «FitFlow · список» в системном списке не отличить
          # от остальных. Картинку рисует tools/widget-list-preview.py —
          # зеркало widget_layout_xml() ниже, а не рисунок от руки.
          (xml / 'fitflow_widget_info.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    android:minWidth="180dp"\n'
              '    android:minHeight="110dp"\n'
