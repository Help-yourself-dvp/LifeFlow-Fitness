              '    android:widgetCategory="home_screen" />\n', encoding='utf-8')

          # 0.9.6: по одному описанию на каждый вариант оформления. Имя (label)
          # видно в списке виджетов лаунчера — владелец сразу понимает, какой
          # из них ставит на экран. Размеры по умолчанию разные: кольцу с
          # строками нужна ширина, плиткам — квадрат.
          canvas_infos = [
              # 0.9.35: 6-й элемент — картинка предпросмотра (None = нет).
              # 0.9.30: бенто вернулся на 4x2 (150 dp) — владелец просил
              # компактнее. В 0.9.28 на 150 dp не хватало высоты, потому что
              # круглая кнопка стояла по центру плиты и делила её с текстом.
              # Теперь кнопка в правом верхнем углу и уменьшена до 38 dp,
              # полоса прогресса лежит отдельным слоем во всю ширину, а поля
              # подложки сжаты (36->14 по вертикали). Бюджет сошёлся без
              # уменьшения шрифтов — расчёт в design/WIDGET-HOWTO.md § 4.
              ('fitflow_widget_bento_info', 'FitFlow · бенто', 250, 150,
               'fitflow_widget_bento', 'fitflow_preview_bento'),
              ('fitflow_widget_neon_info', 'FitFlow · кольца', 250, 150, 'fitflow_widget_neon',
               'fitflow_preview_neon'),
