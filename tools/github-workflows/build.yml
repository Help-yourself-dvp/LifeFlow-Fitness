name: Build Native Android APK

permissions:
  contents: write

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version from version.txt
        shell: bash
        run: |
          APP_VERSION="$(tr -d '[:space:]' < version.txt)"
          if [ -z "$APP_VERSION" ]; then
            echo "ОШИБКА: файл version.txt пуст — сборка остановлена."
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Версия приложения из version.txt: $APP_VERSION"

      - name: Проверить, что активный workflow совпадает с зеркалом
        shell: bash
        run: |
          if cmp -s .github/workflows/build.yml tools/github-workflows/build.yml; then
            echo "✓ Активный workflow совпадает с зеркалом tools/github-workflows/build.yml — нативные правки применены."
          else
            echo "⚠️ ВНИМАНИЕ: активный .github/workflows/build.yml ОТЛИЧАЕТСЯ от зеркала tools/github-workflows/build.yml."
            echo "   Сборка идёт на СТАРОМ нативе — после установки проверьте замену workflow по протоколу."
            diff --stat .github/workflows/build.yml tools/github-workflows/build.yml || true
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Remove stale capacitor config (legacy PWA leftover)
        run: |
          if [ -f capacitor.config.json ]; then
            echo "Найден устаревший capacitor.config.json — удаляю, чтобы cap init создал правильный."
            rm -f capacitor.config.json
          else
            echo "Старого capacitor.config.json нет, всё чисто."
          fi

      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp app.js www/
          mkdir -p www/assets/fonts && cp assets/fonts/*.ttf www/assets/fonts/ 2>/dev/null || true
          cp food-db.js www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp icon.png www/ 2>/dev/null || true

      - name: Inject build number (0.7.11)
        shell: bash
        run: |
          RUN_NUMBER="${{ github.run_number }}"
          sed -i "s/const FITFLOW_BUILD = '[^']*';/const FITFLOW_BUILD = 'build ${RUN_NUMBER}';/" www/app.js
          sed -i "s/v${APP_VERSION} (build [0-9]*)/v${APP_VERSION} (build ${RUN_NUMBER})/" www/index.html
          echo "FITFLOW_BUILD = build ${RUN_NUMBER} (версия ${APP_VERSION})"

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/local-notifications@5.0.7 @capacitor/browser@5.2.0
          # LOCAL_AI_PATCH (0.4.x): нативный модуль нейросети Gemma (LiteRT-LM) из репозитория
          npm install ./plugins/fitflow-local-ai

      - name: Init Android
        run: |
          npx cap init "FitFlow" "com.fitflow.app" --web-dir www
          npx cap add android
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/g' android/variables.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' android/variables.gradle
          # LOCAL_AI_PATCH: LiteRT-LM требует minSdk 24 (по умолчанию шаблон ставит 22/23)
          sed -i 's/minSdkVersion = .*/minSdkVersion = 26/g' android/variables.gradle
          # CAMERA_CHOOSER_PATCH (0.4.3): пункт «Камера» в системном выборе фото WebView
          # (input type=file accept="image/*") виден только при объявленном permission
          # CAMERA в манифесте — без него пикер сразу открывает галерею (полевой баг:
          # «готовое фото выбрать можно, сфотографировать — нет»). uses-feature не
          # обязателен: камера бывает внешней/отсутствует, приложение обязано работать.
          sed -i 's|<application|<uses-feature android:name="android.hardware.camera.any" android:required="false" />\n    <uses-permission android:name="android.permission.CAMERA" />\n\n    <application|' android/app/src/main/AndroidManifest.xml
          # LOCAL_AI_PATCH (0.3.37): D8 с поддержкой Java-21 байткода.
          # litertlm-android:0.12.0 собран под Java 21 (class file major 65) —
          # D8 внутри шаблонного AGP 8.2.1 его не читает (сбой 0.3.36: «Unsupported
          # class file major version 65» на :app:mergeExtDexDebug; то же у
          # error_prone_annotations-2.41.0). Официальный механизм Google — оверрайд
          # R8/D8 новее встроенного через buildscript-classpath корневого
          # android/build.gradle; сам AGP не трогаем (минимальный риск).
          python3 - <<'PYEOF'
          from pathlib import Path as _P
          _p = _P('android/build.gradle')
          _t = _p.read_text(encoding='utf-8')
          if 'com.android.tools:r8:' not in _t:
              _anchor = "classpath 'com.android.tools.build:gradle:"
              _out = []
              _done = False
              for _ln in _t.split('\n'):
                  _out.append(_ln)
                  if (not _done) and _anchor in _ln:
                      _out.append("        classpath 'com.android.tools:r8:8.5.35' // LOCAL_AI_PATCH: D8 с чтением Java-21 байткода (litertlm)")
                      _done = True
              if not _done:
                  raise SystemExit('ОШИБКА: якорь AGP-classpath не найден в android/build.gradle — R8 не внедрён, сборка остановлена')
              _p.write_text('\n'.join(_out), encoding='utf-8')
              print('OK: R8 8.5.35 внедрён в buildscript корневого android/build.gradle')
          else:
              print('classpath com.android.tools:r8 уже есть, пропуск')
          PYEOF
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${APP_VERSION}\"/g" android/app/build.gradle
          echo 'android.suppressUnsupportedCompileSdk=34' >> android/gradle.properties
          # Health Connect dependency — чтение шагов/сна из Zepp, Garmin, Samsung
          sed -i '/dependencies {/a\    implementation "androidx.health.connect:connect-client:1.1.0-alpha07"' android/app/build.gradle
          sed -i '/dependencies {/a\    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"' android/app/build.gradle
          # BARCODE_PATCH (0.9.2): сканер штрих-кода ZXing (Apache-2.0).
          # Выбран вместо ML Kit и BarcodeDetector сознательно: работает полностью
          # офлайн и НЕ требует Google Play Services — на устройствах без GMS
          # (Huawei и часть китайских брендов) решения Google просто не стартуют.
          # minSdkVersion здесь 26 (>= 24), поэтому zxing:core 3.5.x подхватывается
          # без десугаринга и без multiDex — дополнительная настройка не нужна.
          # CAMERA и uses-feature camera.any (required=false) уже объявлены выше
          # блоком CAMERA_CHOOSER_PATCH — второй раз добавлять не нужно.
          # CaptureActivity объявлена в манифесте самой библиотеки и подмешивается
          # при слиянии манифестов, отдельной регистрации не требуется.
          sed -i '/dependencies {/a\    implementation "com.journeyapps:zxing-android-embedded:4.3.0"' android/app/build.gradle
          sed -i '/dependencies {/a\    implementation "com.google.zxing:core:3.5.3"' android/app/build.gradle
                              # Kotlin plugin for HealthConnectHelper.kt
          python3 - <<'PYEOF2'
          from pathlib import Path
          _p = Path('android/build.gradle')
          _t = _p.read_text(encoding='utf-8')
          if 'kotlin-gradle-plugin' not in _t:
              _anchor = "classpath 'com.android.tools:r8:"
              _out = []
              _done = False
              for _ln in _t.split('\n'):
                  _out.append(_ln)
                  if (not _done) and _anchor in _ln:
                      _out.append("        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21'")
                      _done = True
              if _done:
                  _p.write_text('\n'.join(_out), encoding='utf-8')
                  print('OK: Kotlin plugin added to root build.gradle')
              else:
                  print('WARNING: R8 anchor not found, Kotlin plugin NOT added')
          else:
              print('Kotlin plugin already in root build.gradle')
          PYEOF2
          # Apply Kotlin plugin to app module
          sed -i "/apply plugin: 'com.android.application'/a\\apply plugin: 'kotlin-android'" android/app/build.gradle
          npx cap sync android

      - name: Verify webDir is correct (safety check)
        run: |
          echo "Итоговый capacitor.config.json:"
          cat capacitor.config.json || true
          echo "---"
          echo "Содержимое android/app/src/main/assets/public:"
          ls -la android/app/src/main/assets/public 2>/dev/null | head -30 || echo "путь не найден, пропускаем проверку"

      - name: Копировать нативные исходники (android-native/)
        run: |
          set -e
          DEST=android/app/src/main/java/com/fitflow/app
          mkdir -p "$DEST"
          for f in MainActivity.java FitFlowWidgetProvider.java WaterReminderReceiver.java HealthSyncReceiver.java HealthConnectHelper.kt; do
            if [ ! -f "android-native/$f" ]; then
              echo "::error::Не найден android-native/$f"
              exit 1
            fi
            cp "android-native/$f" "$DEST/$f"
            echo "скопирован $f ($(wc -l < "android-native/$f") строк)"
          done
          echo "--- содержимое $DEST ---"
          ls -la "$DEST"

      - name: Patch manifest and icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
          python3 << 'ENDSCRIPT'
          from pathlib import Path
          from PIL import Image

          man = Path('android/app/src/main/AndroidManifest.xml')
          t = man.read_text(encoding='utf-8')
          perms = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECORD_AUDIO',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.USE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.WAKE_LOCK',
              'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
              'android.permission.ACTIVITY_RECOGNITION',
              'android.permission.health.READ_STEPS',
              'android.permission.health.READ_TOTAL_CALORIES_BURNED',
              'android.permission.health.READ_EXERCISE',
              'android.permission.health.READ_SLEEP',
              'android.permission.health.WRITE_EXERCISE',
              'android.permission.health.READ_WEIGHT',
              'android.permission.health.READ_HEIGHT',
          ]
          for p in perms:
              tag = f'    <uses-permission android:name="{p}" />\n'
              if p not in t:
                  t = t.replace('</manifest>', tag + '</manifest>')
          receiver = (
              '        <receiver android:name=".FitFlowWidgetProvider" android:exported="false">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
              '            </intent-filter>\n'
              '            <meta-data android:name="android.appwidget.provider" android:resource="@xml/fitflow_widget_info" />\n'
              '        </receiver>\n'
          )
          if 'FitFlowWidgetProvider' not in t:
              t = t.replace('</application>', receiver + '    </application>')
          health_alias = (
              '        <activity-alias\n'
              '            android:name="ViewPermissionUsageActivity"\n'
              '            android:exported="true"\n'
              '            android:targetActivity=".MainActivity"\n'
              '            android:permission="android.permission.START_VIEW_PERMISSION_USAGE">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.VIEW_PERMISSION_USAGE" />\n'
              '                <category android:name="android.intent.category.HEALTH_PERMISSIONS" />\n'
              '            </intent-filter>\n'
              '        </activity-alias>\n'
          )
          if 'ViewPermissionUsageActivity' not in t:
              t = t.replace('</application>', health_alias + '    </application>')

          health_rationale = (
              '            <intent-filter>\n'
              '                <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />\n'
              '            </intent-filter>\n'
          )
          if 'ACTION_SHOW_PERMISSIONS_RATIONALE' not in t:
              t = t.replace('</activity>', health_rationale + '        </activity>')
          water_receiver = (
              '        <receiver android:name=".WaterReminderReceiver" android:enabled="true" android:exported="true">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.BOOT_COMPLETED" />\n'
              '            </intent-filter>\n'
              '        </receiver>\n'
          )
          if 'WaterReminderReceiver' not in t:
              t = t.replace('</application>', water_receiver + '    </application>')
          health_sync_receiver = (
              '        <receiver android:name=".HealthSyncReceiver" android:enabled="true" android:exported="false">\n'
              '            <intent-filter>\n'
              '                <action android:name="com.fitflow.app.ACTION_HEALTH_PERIODIC_SYNC" />\n'
              '                <action android:name="android.intent.action.BOOT_COMPLETED" />\n'
              '            </intent-filter>\n'
              '        </receiver>\n'
          )
          if 'HealthSyncReceiver' not in t:
              t = t.replace('</application>', health_sync_receiver + '    </application>')
          queries_block = (
              '    <queries>\n'
              '        <intent>\n'
              '            <action android:name="android.health.connect.action.HEALTH_HOME_SETTINGS" />\n'
              '        </intent>\n'
              '        <intent>\n'
              '            <action android:name="androidx.health.ACTION_HEALTH_CONNECT_SETTINGS" />\n'
              '        </intent>\n'
              '        <package android:name="com.google.android.apps.healthdata" />\n'
              '        <package android:name="com.huami.watch.hmwatchmanager" />\n'
              '    </queries>\n'
          )
          if '<queries>' not in t:
              t = t.replace('</manifest>', queries_block + '</manifest>')
          # IME/клавиатура (0.3.17): без softInputMode система не сжимает вьюпорт
          # WebView — клавиатура перекрывает поле, а первая IME-сессия после
          # холодного старта теряется. adjustResize: WebView сам сжимается,
          # Chromium скроллит к полю ввода.
          if 'windowSoftInputMode' not in t:
              t = t.replace('android:name=".MainActivity"',
                            'android:name=".MainActivity"\n            android:windowSoftInputMode="adjustResize"', 1)
          man.write_text(t, encoding='utf-8')

          res = Path('android/app/src/main/res')
          for p in res.rglob('ic_launcher*'):
              if p.is_file():
                  p.unlink()
          legacy = res / 'values' / 'ic_launcher_background.xml'
          if legacy.exists():
              legacy.unlink()

          icon = Path('icon.png')
          if not icon.exists():
              print('no icon.png')
              raise SystemExit(0)

          src = Image.open(icon).convert('RGBA')
          BG = (0, 105, 107, 255)

          def solid(size, path):
              c = Image.new('RGBA', (size, size), BG)
              fg = src.copy()
              fg.thumbnail((int(size * 0.72), int(size * 0.72)), Image.Resampling.LANCZOS)
              c.paste(fg, ((size - fg.width) // 2, (size - fg.height) // 2), fg)
              path.parent.mkdir(parents=True, exist_ok=True)
              c.convert('RGB').save(path, format='PNG')

          def foreground(size, path):
              c = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              fg = src.copy()
              fg.thumbnail((int(size * 0.72), int(size * 0.72)), Image.Resampling.LANCZOS)
              c.paste(fg, ((size - fg.width) // 2, (size - fg.height) // 2), fg)
              path.parent.mkdir(parents=True, exist_ok=True)
              c.save(path, format='PNG')

          for folder, size in {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }.items():
              d = res / folder
              solid(size, d / 'ic_launcher.png')
              solid(size, d / 'ic_launcher_round.png')
              foreground(size, d / 'ic_launcher_foreground.png')

          drawable = res / 'drawable'
          foreground(324, drawable / 'ic_launcher_foreground.png')
          src.resize((96, 96), Image.Resampling.LANCZOS).save(drawable / 'ic_stat_icon.png', format='PNG')

          (res / 'values').mkdir(parents=True, exist_ok=True)
          (res / 'values' / 'colors.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="colorPrimary">#00696B</color>\n'
              '    <color name="colorPrimaryDark">#005052</color>\n'
              '    <color name="ic_launcher_background">#00696B</color>\n'
              '</resources>\n',
              encoding='utf-8',
          )

          (drawable / 'ic_launcher_background.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<vector xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    android:width="108dp"\n'
              '    android:height="108dp"\n'
              '    android:viewportWidth="108"\n'
              '    android:viewportHeight="108">\n'
              '    <path android:fillColor="#00696B" android:pathData="M0,0h108v108h-108z"/>\n'
              '</vector>\n',
              encoding='utf-8',
          )

          (drawable / 'fitflow_widget_btn_water.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n'
              '    <solid android:color="#00696B"/>\n'
              '    <corners android:radius="12dp"/>\n'
              '</shape>\n', encoding='utf-8')

          (drawable / 'fitflow_widget_btn_secondary.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n'
              '    <solid android:color="#E0F2F1"/>\n'
              '    <corners android:radius="12dp"/>\n'
              '    <stroke android:width="1dp" android:color="#00696B"/>\n'
              '</shape>\n', encoding='utf-8')

          (drawable / 'fitflow_widget_background.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n'
              '    <solid android:color="#E8F5F4"/>\n'
              '    <corners android:radius="20dp"/>\n'
              '    <stroke android:width="1dp" android:color="#7AA6A6"/>\n'
              '</shape>\n', encoding='utf-8')
          layout = res / 'layout'
          layout.mkdir(parents=True, exist_ok=True)

          # 0.9.4 (пункт 4 владельца — конфигуратор виджета): строки виджета
          # больше не зашиты в layout. Генерируем пул универсальных слотов
          # (текст + необязательная полоса прогресса); FitFlowWidgetProvider
          # показывает ровно те слоты, которые пользователь выбрал в настройках,
          # и прячет остальные. Компактная раскладка — 5 слотов, большая — 10.
          def widget_slot(i, text_size, bar_height, gap):
              return (
                  '    <LinearLayout android:id="@+id/widget_slot_%d" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="%ddp" android:orientation="vertical" android:visibility="gone">\n'
                  '        <TextView android:id="@+id/widget_slot_%d_text" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="" android:textColor="#002021" android:textSize="%dsp" android:ellipsize="end" android:singleLine="true" android:fontFamily="sans-serif-medium" />\n'
                  '        <ProgressBar android:id="@+id/widget_slot_%d_bar" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="%ddp" android:layout_marginTop="3dp" android:max="100" android:progress="0" android:progressTint="#00696B" android:visibility="gone" />\n'
                  # Вторая полоса — янтарная (питание). Менять цвет полосы из
                  # RemoteViews на minSdk 26 нельзя, поэтому держим два готовых
                  # бара и показываем нужный: без reflection и без риска падения.
                  '        <ProgressBar android:id="@+id/widget_slot_%d_bar2" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="%ddp" android:layout_marginTop="3dp" android:max="100" android:progress="0" android:progressTint="#FF9E3D" android:visibility="gone" />\n'
                  '    </LinearLayout>\n'
              ) % (i, gap, i, text_size, i, bar_height, i, bar_height)

          def widget_layout_xml(slots, padding, title_size, profile_size, text_size, bar_height, gap, btn_height, btn_text):
              parts = [
                  '<?xml version="1.0" encoding="utf-8"?>\n',
                  '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n',
                  '    android:id="@+id/widget_root" android:layout_width="match_parent" android:layout_height="match_parent"\n',
                  '    android:background="@drawable/fitflow_widget_background" android:orientation="vertical" android:padding="%ddp">\n' % padding,
                  '    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="FITFLOW · СЕГОДНЯ" android:textColor="#00696B" android:textSize="%dsp" android:fontFamily="sans-serif-medium" />\n' % title_size,
                  '    <TextView android:id="@+id/widget_profile" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="1dp" android:text="Профиль: Мой профиль" android:textColor="#4A6363" android:textSize="%dsp" android:ellipsize="end" android:singleLine="true" />\n' % profile_size,
              ]
              # 0.9.5: строки живут в контейнере с layout_weight=1 и высотой 0dp.
              # Он забирает всю свободную высоту, поэтому кнопки всегда прижаты к
              # низу: при большом виджете под ними нет пустого поля, при маленьком
              # они не выдавливаются за край (лишнее обрезается сверху, а не снизу).
              parts.append('    <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="vertical">\n')
              for i in range(1, slots + 1):
                  parts.append(widget_slot(i, text_size, bar_height, gap if i > 1 else gap + 3))
              parts.append('    <TextView android:id="@+id/widget_empty" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:text="Откройте настройки приложения и выберите, что показывать" android:textColor="#4A6363" android:textSize="11sp" android:visibility="gone" />\n')
              parts.append('    </LinearLayout>\n')
              parts.append('    <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="7dp" android:orientation="horizontal">\n')
              parts.append('        <Button android:id="@+id/widget_water_btn" android:layout_width="0dp" android:layout_height="%ddp" android:layout_weight="1" android:layout_marginEnd="4dp" android:text="+250 мл" android:textSize="%dsp" android:textColor="#FFFFFF" android:background="@drawable/fitflow_widget_btn_water" android:fontFamily="sans-serif-medium" />\n' % (btn_height, btn_text))
              parts.append('        <Button android:id="@+id/widget_record_btn" android:layout_width="0dp" android:layout_height="%ddp" android:layout_weight="1" android:layout_marginStart="4dp" android:text="📝 Записать" android:textSize="%dsp" android:textColor="#00696B" android:background="@drawable/fitflow_widget_btn_secondary" android:fontFamily="sans-serif-medium" />\n' % (btn_height, btn_text))
              # 0.9.5: кнопка «обновить» — узкая, фиксированной ширины, чтобы не
              # отнимать место у основных действий. Просьба владельца: чинить
              # разъехавшийся виджет на месте, не удаляя и не добавляя его заново.
              parts.append('        <Button android:id="@+id/widget_refresh_btn" android:layout_width="%ddp" android:layout_height="%ddp" android:layout_marginStart="4dp" android:text="⟳" android:textSize="%dsp" android:textColor="#00696B" android:background="@drawable/fitflow_widget_btn_secondary" android:fontFamily="sans-serif-medium" android:contentDescription="Обновить виджет" />\n' % (btn_height, btn_height, btn_text + 2))
              parts.append('    </LinearLayout>\n')
              parts.append('</LinearLayout>\n')
              return ''.join(parts)

          (layout / 'fitflow_widget.xml').write_text(
              widget_layout_xml(5, 14, 11, 10, 13, 4, 4, 34, 11), encoding='utf-8')
          (layout / 'fitflow_widget_large.xml').write_text(
              widget_layout_xml(10, 16, 12, 11, 15, 5, 5, 38, 12), encoding='utf-8')
          xml = res / 'xml'
          xml.mkdir(parents=True, exist_ok=True)
          (xml / 'fitflow_widget_info.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    android:minWidth="180dp"\n'
              '    android:minHeight="110dp"\n'
              '    android:updatePeriodMillis="0"\n'
              '    android:initialLayout="@layout/fitflow_widget"\n'
              '    android:resizeMode="horizontal|vertical"\n'
              '    android:widgetCategory="home_screen" />\n', encoding='utf-8')

          adaptive = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@drawable/ic_launcher_background"/>\n'
              '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          anydpi = res / 'mipmap-anydpi-v26'
          anydpi.mkdir(parents=True, exist_ok=True)
          (anydpi / 'ic_launcher.xml').write_text(adaptive, encoding='utf-8')
          (anydpi / 'ic_launcher_round.xml').write_text(adaptive, encoding='utf-8')
          print('OK icons + manifest')
          ENDSCRIPT

      - name: Restore stable debug keystore (signing)
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            echo "Стабильный debug.keystore восстановлен из секрета — подпись будет постоянной."
          else
            echo "ВНИМАНИЕ: секрет DEBUG_KEYSTORE_BASE64 не найден, будет использован автоматически создаваемый debug.keystore."
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "android/app/build/outputs/apk/debug/FitFlow-v${APP_VERSION}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitFlow-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/FitFlow-v${{ env.APP_VERSION }}-debug.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build${{ github.run_number }}
          name: FitFlow ${{ env.APP_VERSION }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/FitFlow-v${{ env.APP_VERSION }}-debug.apk
