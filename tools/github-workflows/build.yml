                  String savedDate = prefs.getString("date", "");
                  String today = new java.text.SimpleDateFormat("yyyy-MM-dd").format(new java.util.Date());
                  if (savedDate == null || !savedDate.equals(today)) { water = 0; food = 0; activity = 0; }
