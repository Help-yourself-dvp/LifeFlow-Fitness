buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 2.2.21 — ровно версия kotlin-stdlib/reflect, которую тянет
        // litertlm-android:0.12.0 (ошибка сборки 0.3.35: «metadata 2.2.0,
        // expected 2.0.0» — KGP 2.0.21 не читает бинарники Kotlin 2.2).
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "ru.fitflow.localai"
    compileSdkVersion 34

    defaultConfig {
        // LiteRT-LM требует Android 7.0+ (API 24). Для устройств ниже
        // JS-слой честно показывает «модуль недоступен».
        minSdkVersion 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Мост Capacitor — как во всех официальных плагинах: из локального модуля
    // :capacitor-android (его подключает `cap add android` из node_modules).
    // Мавен-артефакта com.getcapacitor:capacitor-android НЕ существует в
    // Google/Maven Central (ошибка сборки 0.3.34: «Could not find …:5.7.0»).
    implementation project(':capacitor-android')
    // AndroidX Activity Result API: тип ActivityResult для @ActivityCallback.
    // capacitor-android 5.7 объявляет androidx.activity как implementation —
    // наружу классы НЕ экспортируются (сбой 0.3.36: «Unresolved reference
    // 'ActivityResult'»; импорт com.getcapacitor.ActivityResult был вовсе неверен —
    // такого класса в Capacitor 5 нет, проверено листингом тега 5.7.0).
    // 1.7.0 = ровно версия, pinned у моста (androidxActivityVersion default
    // capacitor-android 5.7.0) — граф версий без разброда.
    implementation "androidx.activity:activity:1.7.0"
    // LiteRT-LM — официальный рантайм Google для LLM на устройстве (.litertlm).
    implementation "com.google.ai.edge.litertlm:litertlm-android:0.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
